<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1F33" />

  <title>XR Lab Closed</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Roboto:wght@400;500;700;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --navy: #0B1F33;
      --navy-light: #132C45;
      --yellow: #FFD54A;
      --white: #FFFFFF;
      --muted: #C7CED6;
      --line: #28445F;
      --red: #FF5555;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--navy);
      color: var(--white);
      font-family: "IBM Plex Sans", "Roboto", Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen {
      width: 100%;
      max-width: 1000px;

      padding:
        clamp(20px, 4vh, 40px)
        clamp(20px, 5vw, 42px);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      min-height: 100vh;
    }

    .status {
      display: inline-block;

      margin-bottom: clamp(14px, 2vh, 22px);
      padding: 8px 20px;

      border: 2px solid var(--red);
      border-radius: 999px;

      color: var(--red);
      font-size: clamp(15px, 2vw, 22px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: clamp(14px, 2vh, 22px);

      font-size: clamp(58px, 9vw, 118px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.035em;
    }

    h1 .xr {
      color: var(--white);
    }

    h1 .closed {
      color: var(--red);
    }

    .accent-line {
      width: min(220px, 38%);
      height: 5px;

      margin: 0 auto clamp(18px, 2.5vh, 28px);

      background: var(--red);
      border-radius: 999px;
    }

    .message {
      margin-bottom: clamp(22px, 3vh, 34px);

      color: var(--muted);
      font-size: clamp(20px, 2.5vw, 30px);
      font-weight: 400;
      line-height: 1.3;
    }

    .hours-table {
      width: min(680px, 94%);
      margin: 0 auto;

      border-top: 2px solid var(--line);
    }

    .hours-heading {
      padding: 14px 0 10px;

      color: var(--yellow);
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .hours-table table {
      width: 100%;
      border-collapse: collapse;

      font-size: clamp(20px, 2.4vw, 29px);
    }

    .hours-table td {
      padding: clamp(8px, 1.5vh, 13px) 14px;

      border-bottom: 1px solid var(--line);
    }

    .hours-table tr:last-child td {
      border-bottom: none;
    }

    .hours-table td:first-child {
      width: 45%;

      text-align: left;

      color: var(--white);
      font-weight: 700;
    }

    .hours-table td:last-child {
      text-align: right;

      color: var(--yellow);
      font-weight: 600;
    }

    /* Portrait iPads */
    @media (orientation: portrait) {
      .screen {
        padding:
          clamp(18px, 3vh, 32px)
          clamp(20px, 5vw, 34px);
      }

      h1 {
        font-size: clamp(58px, 14vw, 110px);
      }

      .hours-table {
        width: min(680px, 96%);
      }
    }

    /* Shorter screens / landscape */
    @media (max-height: 850px) {
      .screen {
        padding-top: 18px;
        padding-bottom: 18px;
      }

      .status {
        margin-bottom: 12px;
        padding: 6px 18px;
      }

      h1 {
        font-size: clamp(52px, 8vw, 96px);
        margin-bottom: 12px;
      }

      .accent-line {
        margin-bottom: 18px;
      }

      .message {
        margin-bottom: 20px;
      }

      .hours-heading {
        padding-top: 10px;
      }

      .hours-table td {
        padding-top: 8px;
        padding-bottom: 8px;
      }
    }

    /* Very short landscape screens */
    @media (max-height: 650px) {
      .status {
        font-size: 14px;
      }

      h1 {
        font-size: clamp(46px, 7vw, 78px);
      }

      .message {
        font-size: clamp(18px, 2vw, 24px);
      }

      .hours-heading {
        font-size: 16px;
      }

      .hours-table table {
        font-size: clamp(18px, 2vw, 24px);
      }

      .hours-table td {
        padding: 6px 12px;
      }
    }

  </style>
</head>

<body>
  <main class="screen">

    <div class="status">
      Currently Closed
    </div>

    <h1>
      <span class="xr">XR LAB</span><br />
      <span class="closed">CLOSED</span>
    </h1>

    <div class="accent-line"></div>

    <p class="message">
      Please return during regular lab hours.
    </p>

    <div class="hours-table">

      <div class="hours-heading">
        Regular Lab Hours
      </div>

      <table>
        <tbody>

          <tr>
            <td>Tuesday</td>
            <td>9:00 AM – 4:00 PM</td>
          </tr>

          <tr>
            <td>Wednesday</td>
            <td>9:00 AM – 4:00 PM</td>
          </tr>

          <tr>
            <td>Thursday</td>
            <td>9:00 AM – 4:00 PM</td>
          </tr>

        </tbody>
      </table>

    </div>

  </main>
</body>
</html>

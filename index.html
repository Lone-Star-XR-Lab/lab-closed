<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />

  <title>XR Lab Closed</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111111;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .screen {
      width: 100%;
      max-width: 1100px;
      padding: 60px 40px;
    }

    .status {
      display: inline-block;
      margin-bottom: 30px;
      padding: 10px 22px;
      border: 2px solid #FF5555;
      border-radius: 999px;
      color: #FF5555;
      font-size: clamp(18px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(70px, 12vw, 160px);
      line-height: 0.9;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 30px;
    }

    h1 .xr {
      color: #ffffff;
    }

    h1 .closed {
      color: #FF5555;
    }

    .message {
      font-size: clamp(26px, 4vw, 48px);
      line-height: 1.35;
      margin-bottom: 45px;
      color: #dddddd;
    }

    .hours {
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.5;
      margin-bottom: 35px;
    }

    .hours strong {
      color: #ffffff;
    }

    .footer {
      font-size: clamp(18px, 2.2vw, 28px);
      color: #999999;
    }

    .accent-line {
      width: min(260px, 45%);
      height: 6px;
      margin: 0 auto 35px;
      background: #FF5555;
      border-radius: 999px;
    }

    @media (orientation: portrait) {
      .screen {
        padding: 40px 28px;
      }

      h1 {
        font-size: clamp(64px, 16vw, 140px);
      }
    }
  </style>
</head>

<body>
  <main class="screen">
    <div class="status">Currently Closed</div>

    <h1>
      <span class="xr">XR LAB</span><br />
      <span class="closed">CLOSED</span>
    </h1>

    <div class="accent-line"></div>

    <p class="message">
      The XR Lab is currently closed.
    </p>

    <div class="hours">
      <strong>Regular Lab Hours</strong><br />
      Tuesday – Thursday<br />
      9:00 AM – 4:00 PM
    </div>

    <p class="footer">
      Room E251 • East Hall
    </p>
  </main>
</body>
</html>
